[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tokm"
dynamic = ["version"]
description = "Fast local token measurement for text and files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[dependency-groups]
dev = [
    "maturin>=1.7,<2",
    "mypy>=1.10",
    "pytest>=8,<10",
    "ruff>=0.4",
]

[tool.maturin]
manifest-path = "crates/tokm-python/Cargo.toml"
module-name = "tokm._tokm"
python-source = "python"
features = ["extension-module"]
compatibility = "manylinux_2_34"
strip = true

[tool.pytest.ini_options]
testpaths = ["python/tests"]
addopts = "-q -ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PT"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "python"
python_version = "3.11"
files = ["python/tokm", "python/tests"]
