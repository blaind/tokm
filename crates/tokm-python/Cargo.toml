[package]
name = "tokm-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Python bindings for tokm-core"
readme = "../../README.md"
keywords = ["tokenizer", "tokens", "python"]
categories = ["api-bindings", "development-tools"]
homepage = "https://pypi.org/project/tokm/"

[lib]
name = "_tokm"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3.workspace = true
tokm-core = { workspace = true, features = ["git", "hf"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
