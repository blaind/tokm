[package]
name = "tokm-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Token measurement engine for tokm"
documentation = "https://docs.rs/tokm-core"
homepage = "https://crates.io/crates/tokm-core"
keywords = ["tokenizer", "tokens", "measurement"]
categories = ["development-tools", "text-processing"]

[features]
default = ["builtin-tokenizers", "cache"]
builtin-tokenizers = ["dep:tiktoken-rs"]
cache = ["dep:blake3", "dep:directories", "dep:fs2", "dep:serde_json"]
hf = ["dep:blake3", "dep:serde_json", "dep:tokenizers"]
git = ["dep:gix"]

[dependencies]
blake3 = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
globset.workspace = true
gix = { workspace = true, optional = true }
ignore.workspace = true
path-clean.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tiktoken-rs = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
filetime = "0.2"
tempfile.workspace = true

[[bench]]
name = "micro"
harness = false

[lints]
workspace = true
