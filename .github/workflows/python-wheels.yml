name: Python wheels

on:
  pull_request:
    paths:
      - .github/workflows/python-wheels.yml
      - Cargo.lock
      - Cargo.toml
      - crates/tokm-core/**
      - crates/tokm-python/**
      - pyproject.toml
      - python/**
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64
            compatibility: "2_28"
            artifact: linux-x86_64
            test: host
          - name: Linux musl x86_64
            runner: ubuntu-24.04
            target: x86_64
            compatibility: musllinux_1_2
            artifact: musllinux-x86_64
            test: musl
          - name: macOS arm64
            runner: macos-latest
            target: aarch64
            compatibility: "off"
            artifact: macos-arm64
            test: host
          - name: macOS x86_64
            runner: macos-15-intel
            target: x86_64
            compatibility: "off"
            artifact: macos-x86_64
            test: host
          - name: Windows x86_64
            runner: windows-latest
            target: x64
            compatibility: "off"
            artifact: windows-x86_64
            test: host

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build abi3 wheel
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          maturin-version: v1.14.1
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.compatibility }}
          args: --release --locked --compatibility pypi --out dist
          sccache: true
      - name: Test installed wheel
        if: matrix.platform.test == 'host'
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --find-links dist --force-reinstall tokm
          python -c "import tokm; assert tokm.count('hello world').tokens == 2"
      - name: Test installed musllinux wheel
        if: matrix.platform.test == 'musl'
        shell: bash
        run: |
          docker run --rm -v "${{ github.workspace }}:/io" -w /io alpine:3.22 sh -c '
            apk add --no-cache python3 py3-pip py3-virtualenv
            python3 -m virtualenv /tmp/tokm-venv
            . /tmp/tokm-venv/bin/activate
            pip install --no-index --no-deps --find-links dist --force-reinstall tokm
            python -c "import tokm; assert tokm.count(\"hello world\").tokens == 2"
          '
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build source distribution
        uses: PyO3/maturin-action@3e2bdf6ba6453a61e649744019b8a2d906c7eb38 # v1.51.0
        with:
          maturin-version: v1.14.1
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: python-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
