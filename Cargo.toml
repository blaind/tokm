[workspace]
members = ["crates/tokm-cli", "crates/tokm-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
blake3 = "1.8"
clap = { version = "4.6", features = ["derive"] }
directories = "6"
fs2 = "0.4"
globset = "0.4.20"
ignore = "0.4.33"
path-clean = "1"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiktoken-rs = "=0.12.0"
tokm-core = { version = "0.1.0", path = "crates/tokm-core" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
